<style>
  :root {
    --bg: #FFFFFF;
    --panel: #F7F7F7;
    --panel-border: #DADADA;
    --land: #ECECEC;
    --land-border: #BFBFBF;
    --text: #141414;
    --text-muted: #666666;
    --cat-artist: #A8324A;
    --cat-founder: #B78A2D;
    --cat-tech: #2B5C8A;
    --cat-community: #6B3F8A;
    --cat-sustainability: #5B7A5C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  #stage { position: relative; width: 100%; height: 100vh; min-height: 480px; }
  svg#map { width: 100%; height: 100%; display: block; cursor: grab; }
  svg#map:active { cursor: grabbing; }
  .land { fill: var(--land); stroke: var(--land-border); stroke-width: 1; }
  .land:hover { fill: #DEDEDE; }

  .spark {
    cursor: pointer;
    transition: r 0.15s ease, opacity 0.15s ease;
  }
  .spark-glow { pointer-events: none; }
  .spark.dimmed { opacity: 0.12; }

  .cluster { cursor: pointer; transition: opacity 0.15s ease; }
  .cluster.dimmed { opacity: 0.12; }
  .cluster-circle { fill: #E3E3E3; stroke: #141414; }
  .cluster-label {
    fill: #141414; font-family: 'Inter', sans-serif; font-weight: 600;
    pointer-events: none; user-select: none;
  }

  header.hud {
    position: absolute; top: 22px; left: 24px; z-index: 10;
    pointer-events: none;
  }
  header.hud h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px;
    margin: 0 0 4px 0; letter-spacing: 0.2px;
  }
  header.hud p {
    margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 500;
  }

  #filters-panel {
    position: absolute; bottom: 22px; left: 24px; z-index: 10;
    background: rgba(247,247,247,0.92); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px);
    max-width: 240px; max-height: 62vh; overflow-y: auto;
  }
  .filters-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  .filters-title {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px;
  }
  .clear-filters-btn {
    background: none; border: none; padding: 0; margin: 0;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; text-decoration: underline;
  }
  .clear-filters-btn:hover { color: var(--text); }
  .filters-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 12px 0 6px 0; font-weight: 600;
  }
  .filters-section-label:first-of-type { margin-top: 2px; }
  .filter-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 2px;
    cursor: pointer; border-radius: 6px; font-size: 13px; user-select: none;
    transition: background 0.12s ease;
  }
  .filter-item:hover { background: rgba(0,0,0,0.04); }
  .filter-item input[type="checkbox"] { margin: 0; cursor: pointer; flex-shrink: 0; }
  .filter-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-count { margin-left: auto; color: var(--text-muted); font-size: 12px; padding-left: 8px; }

  #zoom-reset {
    position: absolute; top: 96px; left: 24px; z-index: 10;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(247,247,247,0.72); border: 1px solid var(--panel-border);
    color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); transition: background 0.15s ease, color 0.15s ease;
  }
  #zoom-reset:hover { background: rgba(224,224,224,0.95); color: var(--text); }

  #offmap-toggle {
    position: absolute; top: 22px; right: 24px; z-index: 10;
    background: rgba(247,247,247,0.88); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--text);
    cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500;
    backdrop-filter: blur(6px);
  }
  #offmap-toggle:hover { background: rgba(224,224,224,0.95); }

  #offmap-panel {
    position: absolute; top: 68px; right: 24px; z-index: 11;
    width: 300px; max-height: 70vh; overflow-y: auto;
    background: rgba(250,250,250,0.97); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 16px; display: none;
    box-shadow: 0 12px 32px rgba(0,0,0,0.15);
  }
  #offmap-panel.open { display: block; }
  #offmap-panel h3 { font-family: 'Fraunces', serif; font-size: 15px; margin: 0 0 4px 0; }

  }
  .offmap-guest .cat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }

    background: rgba(250,250,250,0.97); border: 1px solid var(--panel-border);

  #tooltip .t-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  #tooltip .t-cat { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
  #tooltip .t-loc { color: var(--text-muted); font-size: 12px; }
  #tooltip .t-hint { color: var(--text-muted); font-size: 11px; margin-top: 6px; font-style: italic; }

  #panel-backdrop {

    z-index: 25;
  }
  #panel-backdrop.open { opacity: 1; pointer-events: auto; }

  #detail-panel {

    font-size: 11px; color: var(--text-muted); max-width: 220px;
    text-align: right; line-height: 1.4; pointer-events: none;

    footer.note { display: none; }

  }

  .scaleExtent([1, 12])
  .on("zoom", (event) => {
    currentTransform = event.transform;
    zoomK = currentTransform.k;
    g.attr("transform", currentTransform);
    glowDefs.selectAll("feGaussianBlur").attr("stdDeviation", GLOW_STD / zoomK);
    redrawGuests();
  });

svg.call(zoom);

document.getElementById("zoom-reset").addEventListener("click", () => {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  worldFeatures = topojson.feature(world, world.objects.countries);
  projection.fitSize([width, height], worldFeatures);

  g.selectAll("path.land")
    .data(worldFeatures.features)
    .join("path")
    .attr("class", "land")
    .attr("d", path);

  guestLayer.raise();

  allGuestPoints = DATA.on_map.map(d => {
    const p = projection([d.lon, d.lat]);
    return { ...d, bx: p?.[0] ?? -100, by: p?.[1] ?? -100 };
  });

  redrawGuests();

  document.getElementById("guest-count-label").textContent =
    `${DATA.on_map.length} guests plotted · ${DATA.off_map.length} not yet on the map`;

  buildFiltersPanel();
  buildOffMapPanel();
}).catch(err => {
  document.getElementById("guest-count-label").textContent =
    "Map data failed to load (needs internet access to jsdelivr.net)";
  console.error(err);
});

// Greedy screen-space clustering: for each unvisited point, gather every
// remaining unvisited point within CLUSTER_PX of it into one group. Not a
// transitive/hierarchical merge -- fine at our scale (~115 guests) and
// matches the "straightforward O(n^2) pass" this doesn't need to be more than.
function clusterPoints(points, transform) {
  const n = points.length;
  const sx = new Array(n), sy = new Array(n);
  for (let i = 0; i < n; i++) {
    sx[i] = transform.applyX(points[i].bx);
    sy[i] = transform.applyY(points[i].by);
  }
  const visited = new Array(n).fill(false);
  const groups = [];
  for (let i = 0; i < n; i++) {
    if (visited[i]) continue;
    visited[i] = true;
    const group = [points[i]];
    for (let j = i + 1; j < n; j++) {
      if (visited[j]) continue;
      const dx = sx[j] - sx[i], dy = sy[j] - sy[i];
      if (dx * dx + dy * dy <= CLUSTER_PX * CLUSTER_PX) {
        visited[j] = true;
        group.push(points[j]);
      }
    }
    groups.push(group);
  }
  return groups;
}

function clusterRadius(n) { return Math.min(22, 11 + Math.sqrt(n) * 2.4); }

// Category and location filters combine with AND: a guest only stays at
// full opacity if it passes both.
function guestVisible(d) {
  return activeCategories.has(d.category) && activeCountries.has(guestCountryKey(d));
}

function redrawGuests() {
  const groups = clusterPoints(allGuestPoints, currentTransform);
  const singles = [];
  const clusters = [];
  groups.forEach(group => {
    if (group.length === 1) {
      singles.push(group[0]);
    } else {
      clusters.push({
        key: group.map(p => p.guest_id).sort((a, b) => a - b).join("-"),
        bx: d3.mean(group, p => p.bx),
        by: d3.mean(group, p => p.by),
        members: group,
      });
    }
  });

  guestLayer.selectAll("circle.spark")
    .data(singles, d => d.guest_id)
    .join(
      enter => enter.append("circle")
        .attr("class", "spark")
        .attr("r", 0)
        .attr("cx", d => d.bx)
        .attr("cy", d => d.by)
        .attr("fill", d => CATEGORY_HEX[d.category] || "#999")
        .attr("filter", d => `url(#glow-${d.category.replace(/[^a-zA-Z]/g, "")})`)
        .attr("stroke", "rgba(0,0,0,0.25)")
        .attr("stroke-width", DOT_STROKE / zoomK)
        .classed("dimmed", d => !guestVisible(d))
        .on("mouseenter", function(event, d) { showTooltip(event, d); d3.select(this).attr("r", DOT_R_HOVER / zoomK); })
        .on("mousemove", function(event) { positionTooltip(event); })
        .on("mouseleave", function() { hideTooltip(); d3.select(this).attr("r", DOT_R / zoomK); })
        .on("click", (event, d) => openGuestDetail(d))
        .call(sel => sel.transition().duration(300).attr("r", DOT_R / zoomK)),
      update => update
        .attr("cx", d => d.bx).attr("cy", d => d.by)
        .attr("r", DOT_R / zoomK)
        .attr("stroke-width", DOT_STROKE / zoomK)
        .classed("dimmed", d => !guestVisible(d)),
      exit => exit.remove()
    );

  guestLayer.selectAll("g.cluster")
    .data(clusters, d => d.key)
    .join(
      enter => {
        const node = enter.append("g")
          .attr("class", "cluster")
          .attr("transform", d => `translate(${d.bx},${d.by})`)
          .classed("dimmed", d => d.members.every(m => !guestVisible(m)))
          .on("mouseenter", function(event, d) { showClusterTooltip(event, d); })
          .on("mousemove", function(event) { positionTooltip(event); })
          .on("mouseleave", function() { hideTooltip(); })
          .on("click", (event, d) => openClusterList(d.members));
        node.append("circle").attr("class", "cluster-circle").attr("r", 0);
        node.append("text").attr("class", "cluster-label").attr("text-anchor", "middle").attr("dominant-baseline", "central");
        node.select("circle.cluster-circle").transition().duration(300)
          .attr("r", d => clusterRadius(d.members.length) / zoomK);
        return node;
      },
      update => {
        update.attr("transform", d => `translate(${d.bx},${d.by})`)
          .classed("dimmed", d => d.members.every(m => !guestVisible(m)));
        update.select("circle.cluster-circle").attr("r", d => clusterRadius(d.members.length) / zoomK);
        return update;
      },
      exit => exit.remove()
    )
    .each(function(d) {
      d3.select(this).select("circle.cluster-circle").attr("stroke-width", 1.5 / zoomK);
      d3.select(this).select("text.cluster-label")
        .attr("font-size", 11 / zoomK)
        .text(d.members.length);
    });
}

function normalizeUrl(url) {
  if (!/^https?:\/\//i.test(url)) return "https://" + url;
  return url;
}

function showTooltip(event, d) {
  tooltip.innerHTML = `
    <div class="t-name">${escapeHtml(d.name)}</div>
    <div class="t-cat">${escapeHtml(d.category)}</div>
    <div class="t-loc">${escapeHtml(d.city)}${d.state ? ", " + escapeHtml(d.state) : ""}</div>
    <div class="t-hint">Click for details</div>
  `;
  tooltip.style.display = "block";
  positionTooltip(event);
}
function showClusterTooltip(event, d) {
  const n = d.members.length;
  tooltip.innerHTML = `
    <div class="t-name">${n} guests near here</div>
    <div class="t-hint">Click to see who</div>
  `;
  tooltip.style.display = "block";
  positionTooltip(event);
}
function positionTooltip(event) {
  const rect = stage.getBoundingClientRect();
  let x = event.clientX - rect.left + 14;
  let y = event.clientY - rect.top + 14;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildFiltersPanel() {
  const catCounts = {};
  DATA.on_map.forEach(d => catCounts[d.category] = (catCounts[d.category] || 0) + 1);

  const countryCounts = {};
  DATA.on_map.forEach(d => {
    const key = guestCountryKey(d);
    countryCounts[key] = (countryCounts[key] || 0) + 1;
  });

  const catContainer = document.getElementById("filter-categories");
  Object.keys(CATEGORY_HEX).forEach(cat => {
    const item = document.createElement("label");
    item.className = "filter-item";
    item.innerHTML = `
      <input type="checkbox" checked>
      <span class="legend-dot" style="background:${CATEGORY_HEX[cat]}"></span>
      <span class="filter-label">${escapeHtml(cat)}</span>
      <span class="legend-count">${catCounts[cat] || 0}</span>
    `;
    item.querySelector("input").addEventListener("change", (event) => {
      if (event.target.checked) activeCategories.add(cat); else activeCategories.delete(cat);
      redrawGuests();
    });
    catContainer.appendChild(item);
  });

  const countryContainer = document.getElementById("filter-countries");
  COUNTRY_LIST.forEach(country => {
    const item = document.createElement("label");
    item.className = "filter-item";
    item.innerHTML = `
      <input type="checkbox" checked>
      <span class="filter-label">${escapeHtml(country)}</span>
      <span class="legend-count">${countryCounts[country] || 0}</span>
    `;
    item.querySelector("input").addEventListener("change", (event) => {
      if (event.target.checked) activeCountries.add(country); else activeCountries.delete(country);
      redrawGuests();
    });
    countryContainer.appendChild(item);
  });

  document.getElementById("clear-filters").addEventListener("click", () => {
    activeCategories = new Set(Object.keys(CATEGORY_HEX));
    activeCountries = new Set(COUNTRY_LIST);
    catContainer.querySelectorAll("input").forEach(cb => cb.checked = true);
    countryContainer.querySelectorAll("input").forEach(cb => cb.checked = true);
    redrawGuests();
  });
}

function buildOffMapPanel() {
  const panel = document.getElementById("offmap-panel");
  const noLoc = DATA.off_map.filter(d => d.reason === "no location yet");
  const failed = DATA.off_map.filter(d => d.reason && d.reason.startsWith("geocoding failed"));

  let html = `<h3>Not shown on the map</h3>
    <div class="subnote">These guests don't have a location yet, or their location couldn't be geocoded -- they're still part of the show, just not plottable here.</div>`;

  if (failed.length) {
    html += `<div class="offmap-group-label">Geocoding failed (${failed.length})</div>`;
    failed.forEach(d => {
      html += `<div class="offmap-guest">
        <span><span class="cat-dot" style="background:${CATEGORY_HEX[d.category] || '#999'}"></span>${escapeHtml(d.name)}</span>
        <span style="color:var(--text-muted)">${escapeHtml(d.city || "")}</span>
      </div>`;
    });
  }
  if (noLoc.length) {
    html += `<div class="offmap-group-label">Location not yet researched (${noLoc.length})</div>`;
    noLoc.forEach(d => {
      html += `<div class="offmap-guest">
        <span><span class="cat-dot" style="background:${CATEGORY_HEX[d.category] || '#999'}"></span>${escapeHtml(d.name)}</span>
      </div>`;
    });
  }
  panel.innerHTML = html;

  document.getElementById("offmap-toggle").addEventListener("click", () => {
    panel.classList.toggle("open");
  });
}

window.addEventListener("resize", () => {
  width = stage.clientWidth; height = stage.clientHeight;
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  if (worldFeatures) projection.fitSize([width, height], worldFeatures);
  g.selectAll("path.land").attr("d", path);
  allGuestPoints.forEach(p => {
    const proj = projection([p.lon, p.lat]);
    p.bx = proj?.[0] ?? -100;
    p.by = proj?.[1] ?? -100;
  });
  redrawGuests();
});

// ---------- Detail / cluster-list side panel ----------

const detailPanel = document.getElementById("detail-panel");
const panelBackdrop = document.getElementById("panel-backdrop");
const detailContent = document.getElementById("detail-content");

function openPanel(html) {
  detailContent.innerHTML = html;
  detailPanel.classList.add("open");
  panelBackdrop.classList.add("open");
}
function closePanel() {
  detailPanel.classList.remove("open");
  panelBackdrop.classList.remove("open");
}
document.getElementById("panel-close").addEventListener("click", closePanel);
panelBackdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closePanel();
});

const SOCIAL_LABELS = { instagram: "IG", tiktok: "TT", facebook: "FB", linkedin: "LI" };
const SOCIAL_ORDER = ["instagram", "tiktok", "facebook", "linkedin"];

function socialRowHtml(d) {
  const chips = [];
  SOCIAL_ORDER.forEach(key => {
    const url = d.social && d.social[key];
    if (url) chips.push(`<a class="social-chip" href="${escapeHtml(normalizeUrl(url))}" target="_blank" rel="noopener">${SOCIAL_LABELS[key]}</a>`);
  });
  if (d.website) chips.push(`<a class="social-chip" href="${escapeHtml(normalizeUrl(d.website))}" target="_blank" rel="noopener">Web</a>`);
  return chips.length ? `<div class="social-row">${chips.join("")}</div>` : "";
}

function episodesHtml(d) {
  const episodes = d.episodes || [];
  if (!episodes.length) return "";
  const label = episodes.length === 1 ? "Episode" : "Episodes";
  const items = episodes.map(ep => `
    <div class="episode-item">
      <div class="episode-title">${escapeHtml(ep.title)}</div>
      ${ep.listen_url ? `<a class="episode-listen" href="${escapeHtml(normalizeUrl(ep.listen_url))}" target="_blank" rel="noopener">Listen →</a>` : ""}
    </div>
  `).join("");
  return `<div class="panel-section-label">${label}</div>${items}`;
}

function renderGuestDetailHtml(d) {
  const loc = [d.city, d.state, d.country].filter(Boolean).join(", ");
  return `
    <h2 class="panel-name">${escapeHtml(d.name)}</h2>
    <div class="panel-category">
      <span class="cat-dot" style="background:${CATEGORY_HEX[d.category] || '#999'}"></span>
      ${escapeHtml(d.category || "")}
    </div>
    ${loc ? `<div class="panel-field">${escapeHtml(loc)}</div>` : ""}
    ${d.institution ? `<div class="panel-field"><strong>${escapeHtml(d.institution)}</strong></div>` : ""}
    ${socialRowHtml(d)}
    ${episodesHtml(d)}
  `;
}

function openGuestDetail(d) {
  openPanel(renderGuestDetailHtml(d));
}

function renderClusterListHtml(members) {
  const byCategory = {};
  members.forEach(m => {
    (byCategory[m.category] = byCategory[m.category] || []).push(m);
  });

  let html = `<h2 class="panel-name">${members.length} guests</h2>
    <div class="cluster-list-note">These guests are close together at the current zoom level. Pick a name to see their details.</div>`;

  Object.keys(CATEGORY_HEX).forEach(cat => {
    const group = byCategory[cat];
    if (!group || !group.length) return;
    html += `<div class="cluster-list-group-label">${escapeHtml(cat)} (${group.length})</div>`;
    group.forEach(m => {
      html += `<div class="cluster-list-item" data-guest-id="${m.guest_id}">
        <span class="cat-dot" style="background:${CATEGORY_HEX[m.category] || '#999'}"></span>
        <span>${escapeHtml(m.name)}</span>
      </div>`;
    });
  });
  return html;
}

function openClusterList(members) {
  openPanel(renderClusterListHtml(members));
  detailContent.querySelectorAll(".cluster-list-item").forEach(el => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.guestId);
      const guest = members.find(m => m.guest_id === id);
      if (guest) openGuestDetail(guest);
    });
  });
}
</script>

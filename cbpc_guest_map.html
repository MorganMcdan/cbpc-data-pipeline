  header.hud {

  .legend-item {

    cursor: pointer; border-radius: 6px; font-size: 13px; user-select: none;
    transition: background 0.12s ease;
  }
  .legend-item:hover { background: rgba(255,255,255,0.04); }
  .legend-item.off { opacity: 0.35; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-count { margin-left: auto; color: var(--text-muted); font-size: 12px; }

  #offmap-toggle {

    background: rgba(27,31,41,0.88); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--text);
    cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500;
    backdrop-filter: blur(6px);
  }
  #offmap-toggle:hover { background: rgba(38,44,58,0.95); }

  #offmap-panel {
    position: absolute; top: 68px; right: 24px; z-index: 11;
    width: 300px; max-height: 70vh; overflow-y: auto;
    background: rgba(20,23,31,0.97); border: 1px solid var(--panel-border);

    box-shadow: 0 12px 32px rgba(0,0,0,0.4);

  .offmap-group-label {

  }

  }
  .offmap-guest .cat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }

    background: rgba(18,21,28,0.97); border: 1px solid var(--panel-border);

  #tooltip .t-cat { color: var(--text-muted); font-size: 12px; margin-bottom: 4px; }
  #tooltip .t-loc { color: var(--text-muted); font-size: 12px; }
  #tooltip .t-hint { color: var(--text-muted); font-size: 11px; margin-top: 6px; font-style: italic; }

  footer.note {
    position: absolute; bottom: 22px; right: 24px; z-index: 10;
    font-size: 11px; color: var(--text-muted); max-width: 220px;
    text-align: right; line-height: 1.4; pointer-events: none;

    #legend { max-width: 160px; padding: 10px; }
    footer.note { display: none; }
    #offmap-panel { width: 240px; }

gory": "Founder/Entrepreneur", "city": null, "state": null, "country": "United States", "website": "https://robgreenlee.com/", "social": {"instagram": "https://www.instagram.com/robwgreenlee/?hl=en"}, "reason": "no location yet"}, {"guest_id": 83, "name": "Thom Schelk", "category": "Community Organizer", "city": null, "state": null, "country": null, "website": null, "social": {}, "reason": "no location yet"}, {"guest_id": 27, "name": "Tim Packer", "category": "Artist/Creative", "city": "Toronto", "state": null, "country": "Canada", "website": "https://www.timpackerartacademy.com/", "social": {"facebook": "https://www.facebook.com/photo/?fbid=200544161442660", "linkedin": "https://www.linkedin.com/in/timpacker1/"}, "reason": "outside the US (Canada)"}]};
// resolved hex values (CSS vars don't work inside SVG fill via JS reliably in every renderer)
const CATEGORY_HEX = {
  "Artist/Creative": "#F0637A",
  "Founder/Entrepreneur": "#F0B84B",
  "Tech Builder": "#48C9B0",
  "Community Organizer": "#9B87E8",
  "Sustainability Leader": "#7FC79E",
};

const svg = d3.select("#map");
const stage = document.getElementById("stage");
let width = stage.clientWidth, height = stage.clientHeight;
svg.attr("viewBox", `0 0 ${width} ${height}`);

const projection = d3.geoAlbersUsa().translate([width / 2, height / 2]).scale(width * 1.05);
const path = d3.geoPath().projection(projection);

const g = svg.append("g");
const glowDefs = svg.append("defs");

Object.entries(CATEGORY_HEX).forEach(([cat, hex]) => {
  const filterId = "glow-" + cat.replace(/[^a-zA-Z]/g, "");
  const filter = glowDefs.append("filter")
    .attr("id", filterId)
    .attr("x", "-200%").attr("y", "-200%").attr("width", "500%").attr("height", "500%");
  filter.append("feGaussianBlur").attr("stdDeviation", 3).attr("result", "blur");
  filter.append("feMerge").selectAll("feMergeNode")
    .data(["blur", "SourceGraphic"])
    .enter().append("feMergeNode").attr("in", d => d);
});

const tooltip = document.getElementById("tooltip");
let activeCategories = new Set(Object.keys(CATEGORY_HEX));

d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
  const states = topojson.feature(us, us.objects.states);

  g.selectAll("path.state")
    .data(states.features)
    .join("path")
    .attr("class", "state")
    .attr("d", path);

  renderGuests();
}).catch(err => {
  document.getElementById("guest-count-label").textContent =
    "Map data failed to load (needs internet access to jsdelivr.net)";
  console.error(err);
});

function renderGuests() {
  const guestLayer = g.append("g").attr("class", "guests");

  const dots = guestLayer.selectAll("circle.spark")
    .data(DATA.on_map)
    .join("circle")
    .attr("class", "spark")
    .attr("r", 0)
    .attr("cx", d => projection([d.lon, d.lat])?.[0] ?? -100)
    .attr("cy", d => projection([d.lon, d.lat])?.[1] ?? -100)
    .attr("fill", d => CATEGORY_HEX[d.category] || "#999")
    .attr("filter", d => `url(#glow-${d.category.replace(/[^a-zA-Z]/g, "")})`)
    .attr("stroke", "rgba(0,0,0,0.25)")
    .attr("stroke-width", 0.5)
    .on("mouseenter", function(event, d) { showTooltip(event, d); d3.select(this).attr("r", 7); })
    .on("mousemove", function(event) { positionTooltip(event); })
    .on("mouseleave", function() { hideTooltip(); d3.select(this).attr("r", 4.5); })
    .on("click", function(event, d) {
      if (d.website) window.open(normalizeUrl(d.website), "_blank");
      else if (d.social && Object.values(d.social)[0]) window.open(normalizeUrl(Object.values(d.social)[0]), "_blank");
    });

  dots.transition()
    .duration(500)
    .delay((d, i) => i * 8)
    .attr("r", 4.5);

  document.getElementById("guest-count-label").textContent =
    `${DATA.on_map.length} guests plotted · ${DATA.off_map.length} not yet on the map`;

  buildLegend(dots);
  buildOffMapPanel();
}

function normalizeUrl(url) {
  if (!/^https?:\/\//i.test(url)) return "https://" + url;
  return url;
}

function showTooltip(event, d) {
  tooltip.innerHTML = `
    <div class="t-name">${escapeHtml(d.name)}</div>
    <div class="t-cat">${escapeHtml(d.category)}</div>
    <div class="t-loc">${escapeHtml(d.city)}${d.state ? ", " + escapeHtml(d.state) : ""}</div>
    ${(d.website || Object.keys(d.social || {}).length) ? '<div class="t-hint">Click to visit their site</div>' : ""}
  `;
  tooltip.style.display = "block";
  positionTooltip(event);
}
function positionTooltip(event) {
  const rect = stage.getBoundingClientRect();
  let x = event.clientX - rect.left + 14;
  let y = event.clientY - rect.top + 14;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function buildLegend(dots) {
  const counts = {};
  DATA.on_map.forEach(d => counts[d.category] = (counts[d.category] || 0) + 1);

  const container = document.getElementById("legend-items");
  Object.keys(CATEGORY_HEX).forEach(cat => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `
      <span class="legend-dot" style="background:${CATEGORY_HEX[cat]}"></span>
      <span>${cat}</span>
      <span class="legend-count">${counts[cat] || 0}</span>
    `;
    item.addEventListener("click", () => {
      if (activeCategories.has(cat)) { activeCategories.delete(cat); item.classList.add("off"); }
      else { activeCategories.add(cat); item.classList.remove("off"); }
      dots.classed("dimmed", d => !activeCategories.has(d.category));
    });
    container.appendChild(item);
  });
}

function buildOffMapPanel() {
  const panel = document.getElementById("offmap-panel");
  const noLoc = DATA.off_map.filter(d => d.reason === "no location yet");
  const intl = DATA.off_map.filter(d => d.reason && d.reason.startsWith("outside"));

  let html = `<h3>Not shown on the map</h3>
    <div class="subnote">These guests are outside the continental-US view or don't have a location yet -- they're still part of the show, just not plottable here.</div>`;

  if (intl.length) {
    html += `<div class="offmap-group-label">Outside the US (${intl.length})</div>`;
    intl.forEach(d => {
      html += `<div class="offmap-guest">
        <span><span class="cat-dot" style="background:${CATEGORY_HEX[d.category] || '#999'}"></span>${escapeHtml(d.name)}</span>
        <span style="color:var(--text-muted)">${escapeHtml(d.city || "")}</span>
      </div>`;
    });
  }
  if (noLoc.length) {
    html += `<div class="offmap-group-label">Location not yet researched (${noLoc.length})</div>`;
    noLoc.forEach(d => {
      html += `<div class="offmap-guest">
        <span><span class="cat-dot" style="background:${CATEGORY_HEX[d.category] || '#999'}"></span>${escapeHtml(d.name)}</span>
      </div>`;
    });
  }
  panel.innerHTML = html;

  document.getElementById("offmap-toggle").addEventListener("click", () => {
    panel.classList.toggle("open");
  });
}

window.addEventListener("resize", () => {
  width = stage.clientWidth; height = stage.clientHeight;
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  projection.translate([width / 2, height / 2]).scale(width * 1.05);
  g.selectAll("path.state").attr("d", path);
  g.selectAll("circle.spark")
    .attr("cx", d => projection([d.lon, d.lat])?.[0] ?? -100)
    .attr("cy", d => projection([d.lon, d.lat])?.[1] ?? -100);
});
</script>
